<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#f5f5f5"/>
  <rect x="100" y="80" width="200" height="240" rx="8" fill="white" stroke="#e5e5e5" stroke-width="2"/>
  
  <!-- T-shirt shape -->
  <path d="M150 120 L250 120 L270 200 L230 240 L170 240 L130 200 Z" fill="#f8f8f8" stroke="#d4d4d4" stroke-width="2"/>
  
  <!-- Neck -->
  <ellipse cx="200" cy="130" rx="30" ry="20" fill="white" stroke="#d4d4d4" stroke-width="2"/>
  
  <!-- Sleeves -->
  <rect x="120" y="140" width="40" height="60" rx="4" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="240" y="140" width="40" height="60" rx="4" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1"/>
  
  <!-- Design elements -->
  <circle cx="200" cy="180" r="12" fill="#3b82f6" opacity="0.7"/>
  <circle cx="180" cy="210" r="8" fill="#10b981" opacity="0.7"/>
  <circle cx="220" cy="210" r="8" fill="#8b5cf6" opacity="0.7"/>
  
  <!-- Text label -->
  <rect x="140" y="280" width="120" height="24" rx="4" fill="#e5e5e5"/>
  <text x="200" y="296" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" font-weight="bold">FASHION</text>
  
  <!-- Premium badge -->
  <circle cx="320" cy="100" r="24" fill="#000"/>
  <text x="320" y="105" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">PREMIUM</text>
</svg>